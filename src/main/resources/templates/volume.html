<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Volume Converter</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="container">

    <h1>Volume Converter</h1>

    <form th:action="@{/volume}"
          th:object="${request}"
          method="post">

        <label for="value">Value</label>

        <input id="value"
               type="number"
               step="any"
               th:field="*{value}"
               required>

        <br><br>

        <label for="from">From</label>

        <select id="from"
                th:field="*{from}">

            <option value="ml">Milliliter</option>
            <option value="l">Liter</option>
            <option value="m3">Cubic Meter</option>
            <option value="cm3">Cubic Centimeter</option>
            <option value="gal">US Gallon</option>
            <option value="ft3">Cubic Foot</option>

        </select>

        <br><br>

        <label for="to">To</label>

        <select id="to"
                th:field="*{to}">

            <option value="ml">Milliliter</option>
            <option value="l">Liter</option>
            <option value="m3">Cubic Meter</option>
            <option value="cm3">Cubic Centimeter</option>
            <option value="gal">US Gallon</option>
            <option value="ft3">Cubic Foot</option>

        </select>

        <br><br>

        <button type="submit">
            Convert
        </button>

    </form>

    <br>

    <div class="result"
         th:if="${result != null}">

        <h2>Result</h2>

        <p>

            <span th:text="${request.value}"></span>

            <span th:text="${fromUnit}"></span>

            =

            <strong th:text="${result}"></strong>

            <span th:text="${toUnit}"></span>

        </p>

    </div>

    <br>

    <a th:href="@{/}">
        ← Back to Home
    </a>

</div>

</body>

</html>
