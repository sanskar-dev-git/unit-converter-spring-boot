<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volume Converter</title>

    <!-- Instant Theme Load Script (Prevents Dark/Light Flicker) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container subpage-container">

    <!-- Header & Navigation -->
    <div class="header-wrapper">
        <div>
            <a th:href="@{/}" class="back-link">← Back to Home</a>
            <h1>🧪 Volume Converter</h1>
        </div>

        <button id="themeToggle" class="theme-toggle-btn" type="button">
            <span id="themeIcon">🌙</span>
            <span id="themeText">Dark Mode</span>
        </button>
    </div>

    <!-- Converter Form -->
    <form th:action="@{/volume}" th:object="${request}" method="post" class="converter-form">

        <div class="form-group">
            <label for="value">Value</label>
            <input id="value"
                   type="number"
                   step="any"
                   th:field="*{value}"
                   placeholder="Enter value..."
                   required
                   class="form-input">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="from">From</label>
                <select id="from" th:field="*{from}" class="form-select">
                    <option value="ml">Milliliter (mL)</option>
                    <option value="l">Liter (L)</option>
                    <option value="m3">Cubic Meter (m³)</option>
                    <option value="cm3">Cubic Centimeter (cm³)</option>
                    <option value="gal">US Gallon (gal)</option>
                    <option value="ft3">Cubic Foot (ft³)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="to">To</label>
                <select id="to" th:field="*{to}" class="form-select">
                    <option value="ml">Milliliter (mL)</option>
                    <option value="l">Liter (L)</option>
                    <option value="m3">Cubic Meter (m³)</option>
                    <option value="cm3">Cubic Centimeter (cm³)</option>
                    <option value="gal">US Gallon (gal)</option>
                    <option value="ft3">Cubic Foot (ft³)</option>
                </select>
            </div>
        </div>

        <button type="submit" class="submit-btn">
            Convert Units
        </button>

    </form>

    <!-- Calculation Result Display -->
    <div class="result-card" th:if="${result != null}">
        <h2>Result</h2>
        <p class="result-text">
            <span th:text="${request.value}"></span>
            <span th:text="${fromUnit}"></span>
            <span class="equals-sign">=</span>
            <strong th:text="${result}"></strong>
            <span th:text="${toUnit}"></span>
        </p>
    </div>

</div>

<!-- Theme Switcher Script -->
<script>
    const toggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
    updateToggleUI(currentTheme);

    toggleBtn.addEventListener('click', () => {
        const activeTheme = document.documentElement.getAttribute('data-theme');
        const newTheme = activeTheme === 'light' ? 'dark' : 'light';

        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        updateToggleUI(newTheme);
    });

    function updateToggleUI(theme) {
        if (theme === 'light') {
            themeIcon.textContent = '☀️';
            themeText.textContent = 'Light Mode';
        } else {
            themeIcon.textContent = '🌙';
            themeText.textContent = 'Dark Mode';
        }
    }
</script>

</body>
</html>
